<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Azm Journey</title>
<style>
@font-face{font-family:Cairo;src:url(assets/fonts/cairo-arabic-400.woff2) format("woff2");font-weight:400}
@font-face{font-family:Cairo;src:url(assets/fonts/cairo-arabic-600.woff2) format("woff2");font-weight:600}
@font-face{font-family:Cairo;src:url(assets/fonts/cairo-arabic-700.woff2) format("woff2");font-weight:700}
@font-face{font-family:Cairo;src:url(assets/fonts/cairo-arabic-800.woff2) format("woff2");font-weight:800 900}
@font-face{font-family:Inter;src:url(assets/fonts/inter-latin-400.woff2) format("woff2");font-weight:400}
@font-face{font-family:Inter;src:url(assets/fonts/inter-latin-600.woff2) format("woff2");font-weight:600}
@font-face{font-family:Inter;src:url(assets/fonts/inter-latin-700.woff2) format("woff2");font-weight:700}
@font-face{font-family:Inter;src:url(assets/fonts/inter-latin-800.woff2) format("woff2");font-weight:800 900}
/* Tokens from docs/design.md and docs/brand/promo_video (brand #22C55E, splash #07120C, trend colours). */
:root{
  --p:#22C55E; --on-p:#04210F; --g0:#07120C; --hue:0deg;
  --glass:rgba(22,34,28,.66); --edge:rgba(255,255,255,.14); --hi:rgba(255,255,255,.10);
  --t1:#F2F7F3; --t2:#B4C2BA; --t3:#7C8B83;
  --up:#4ADE80; --keep:#93C5FD; --down:#FBBF24; --new:#C4B5FD; --err:#F87171;
  --chip:rgba(255,255,255,.07);
  --mono:'JetBrains Mono','DejaVu Sans Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Cairo,Inter,sans-serif;color:var(--t1);background:var(--g0)}
.lat,.n{font-family:Inter,Cairo,sans-serif;direction:ltr;unicode-bidi:isolate}
.n{font-variant-numeric:tabular-nums}
.green{color:var(--p)}
.abs{position:absolute}
/* background */
.bg{position:absolute;inset:0;overflow:hidden;filter:hue-rotate(var(--hue))}
.blob{position:absolute;border-radius:50%;filter:blur(140px);opacity:.8}
.b1{width:1000px;height:1100px;left:300px;top:-500px;background:#14532D}
.b2{width:900px;height:1000px;left:-420px;top:1100px;background:#0B3B24}
.b3{width:600px;height:600px;left:240px;top:700px;background:#22C55E;opacity:.09}
.grid{position:absolute;inset:-120px;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:90px 90px;-webkit-mask-image:radial-gradient(closest-side,#000,transparent)}
.vign{position:absolute;inset:0;background:radial-gradient(130% 80% at 50% 45%,transparent 50%,rgba(0,0,0,.6) 100%)}
/* header (below the 220 px top safe line) */
#hdr{position:absolute;left:60px;right:60px;top:236px;height:110px;z-index:20}
#hdr .row1{display:flex;align-items:center;justify-content:space-between;height:60px}
.epchip{display:inline-flex;align-items:center;gap:14px;height:60px;padding:0 26px;border-radius:30px;background:var(--glass);border:1px solid var(--edge);font:800 36px Cairo,Inter}
.epchip b{color:var(--p)}
.datechip{font:700 36px Cairo,Inter;color:var(--t2)}
.segs{display:flex;gap:8px;margin-top:22px;direction:rtl}
.seg{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.12);position:relative;overflow:hidden}
.seg.done{background:color-mix(in srgb,var(--p) 55%,#0000)}
.seg .fill{position:absolute;inset:0;background:var(--p);transform-origin:right center;transform:scaleX(0)}
/* scenes */
.scene{position:absolute;left:0;right:0;top:370px;height:1150px;visibility:hidden}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 70px;gap:34px}
.kicker{display:inline-flex;align-items:center;gap:12px;height:62px;padding:0 28px;border-radius:31px;background:color-mix(in srgb,var(--p) 16%,transparent);border:1px solid color-mix(in srgb,var(--p) 45%,transparent);font:800 38px Cairo,Inter;color:var(--p)}
.big{font:800 100px/1.28 Cairo,Inter;letter-spacing:-.01em;text-wrap:balance}
.say{font:800 80px/1.32 Cairo,Inter;text-wrap:balance}
.sub{font:600 42px/1.55 Cairo,Inter;color:var(--t2);text-wrap:balance}
.cap{font:800 64px/1.3 Cairo,Inter;text-align:center;text-wrap:balance}
.w{display:inline-block;white-space:nowrap}
.acc{color:var(--p);text-shadow:0 0 50px color-mix(in srgb,var(--p) 50%,transparent)}
.top{position:absolute;left:60px;right:60px;top:0;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.gl{background:var(--glass);border:1px solid var(--edge);box-shadow:inset 0 1px 0 var(--hi),0 30px 60px -30px #000c;backdrop-filter:blur(20px)}
/* counters */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:28px;width:960px}
.cgrid.one{grid-template-columns:1fr;width:820px}
.tile{border-radius:40px;padding:34px 30px 30px;display:flex;flex-direction:column;align-items:center;gap:6px}
.tile .num{font:800 128px/1.05 Inter,Cairo;color:var(--p);direction:ltr;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile.huge .num{font-size:190px}
.tile .lbl{font:700 42px/1.35 Cairo,Inter;color:var(--t1);text-align:center}
.note{font:600 40px/1.5 Cairo,Inter;color:var(--t2);max-width:940px;text-align:center}
/* phone with a real screenshot */
.dev{position:absolute;left:50%;border-radius:64px;padding:14px;background:linear-gradient(145deg,#2a332e,#0b0f0d 40%,#1a221e);box-shadow:0 0 0 2px rgba(255,255,255,.08),0 60px 120px -30px #000}
.dev img{display:block;width:100%;height:100%;object-fit:cover;object-position:top;border-radius:50px}
.real{position:absolute;z-index:3;left:0;right:0;margin:0 auto;width:fit-content;white-space:nowrap;display:inline-flex;align-items:center;gap:12px;height:56px;padding:0 24px;border-radius:28px;background:#0B1A12ee;border:1px solid var(--edge);font:700 36px Cairo,Inter;color:var(--t2)}
.real i{width:14px;height:14px;border-radius:7px;background:var(--p);display:inline-block}
/* code */
.code{width:1000px;border-radius:36px;overflow:hidden;direction:ltr;text-align:left}
.code .bar{display:flex;align-items:center;gap:14px;height:76px;padding:0 30px;border-bottom:1px solid var(--edge);font:600 36px var(--mono);color:var(--t2);white-space:nowrap;overflow:hidden}
.code .dots{display:flex;gap:10px;flex:none}.code .dots i{width:16px;height:16px;border-radius:8px;background:#ffffff30}
.code pre{margin:0;padding:26px 0;font:500 36px/1.6 var(--mono);color:#E6EDF3}
.code .ln{display:block;padding:0 28px;white-space:pre;min-height:57px}
.code .ln.add{background:rgba(74,222,128,.13)}
.code .ln.del{background:rgba(248,113,113,.13);color:#fca5a5}
.code .ln.hl{background:rgba(255,255,255,.06)}
.k{color:#FF7B72}.s{color:#A5D6FF}.c{color:#8B949E;font-style:italic}.nm{color:#79C0FF}.ty{color:#FFA657}.fn{color:#D2A8FF}
.caret{display:inline-block;width:20px;height:42px;vertical-align:-8px;background:var(--p);margin-left:2px}
/* diagram */
.dia{display:flex;flex-direction:column;align-items:center;width:960px}
.node{width:880px;border-radius:34px;padding:24px 34px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.node .t{font:800 54px/1.3 Cairo,Inter}
.node .d{font:600 40px/1.45 Cairo,Inter;color:var(--t2)}
.node.bad{border-color:rgba(248,113,113,.6);background:rgba(127,29,29,.35)}
.node.bad .t{color:#FCA5A5}
.node.good{border-color:color-mix(in srgb,var(--p) 70%,transparent);background:color-mix(in srgb,var(--p) 18%,#0000)}
.node.good .t{color:var(--p)}
.arrow{width:6px;height:58px;background:linear-gradient(var(--edge),var(--p));position:relative;margin:4px 0;transform-origin:top}
.arrow::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-14px;border:14px solid transparent;border-top:18px solid var(--p);border-bottom:0}
.opts{display:flex;flex-direction:column;gap:22px;width:940px}
.opt{display:flex;align-items:center;gap:26px;border-radius:32px;padding:24px 30px;text-align:start}
.opt .mk{width:70px;height:70px;border-radius:35px;display:grid;place-items:center;font:900 44px Inter;flex:none}
.opt.bad .mk{background:rgba(248,113,113,.18);color:#F87171}
.opt.good .mk{background:color-mix(in srgb,var(--p) 22%,#0000);color:var(--p)}
.opt .t{font:800 46px/1.3 Cairo,Inter}.opt .d{font:600 38px/1.4 Cairo,Inter;color:var(--t2)}
.opt.good{border-color:color-mix(in srgb,var(--p) 60%,transparent)}
/* split before/after */
.split{display:flex;flex-direction:column;gap:30px;width:960px}
.half{border-radius:36px;padding:30px 36px;text-align:start;position:relative;overflow:hidden}
.half .tag{display:inline-flex;height:52px;align-items:center;padding:0 22px;border-radius:26px;font:800 36px Cairo,Inter;margin-bottom:12px}
.half.before .tag{background:rgba(248,113,113,.18);color:#FCA5A5}
.half.after .tag{background:color-mix(in srgb,var(--p) 20%,#0000);color:var(--p)}
.half .t{font:800 60px/1.3 Cairo,Inter}
.half .d{font:600 44px/1.45 Cairo,Inter;color:var(--t2);margin-top:6px}
.half.before .t{color:#FECACA}
/* chips + steps */
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;width:980px}
.chip{display:inline-flex;align-items:center;gap:14px;min-height:88px;padding:8px 34px;border-radius:44px;font:700 46px/1.3 Cairo,Inter}
.chip i{width:16px;height:16px;border-radius:8px;background:var(--p);flex:none}
.steps{display:flex;flex-direction:column;gap:16px;width:960px}
.step{display:flex;align-items:center;gap:24px;border-radius:30px;padding:16px 26px;text-align:start}
.step .no{width:84px;height:68px;border-radius:22px;display:grid;place-items:center;background:color-mix(in srgb,var(--p) 20%,#0000);color:var(--p);font:800 36px Inter;flex:none;direction:ltr}
.step .t{font:700 42px/1.3 Cairo,Inter}
.step .d{font:600 36px/1.35 Cairo,Inter;color:var(--t2)}
/* timeline */
.tl{position:relative;width:960px;height:560px}
.tl .col{position:absolute;bottom:90px;width:44px;display:flex;flex-direction:column-reverse;gap:6px;align-items:center}
.tl .dot{width:30px;height:21px;border-radius:7px;background:rgba(255,255,255,.22)}
.tl .dot.on{background:var(--p);box-shadow:0 0 18px color-mix(in srgb,var(--p) 70%,transparent)}
.tl .axis{position:absolute;left:0;right:0;bottom:70px;height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
.tl .dl{position:absolute;bottom:0;font:700 36px Cairo,Inter;color:var(--t2);white-space:nowrap}
.tlcount{font:800 64px Inter,Cairo;color:var(--p);direction:ltr}
/* promo */
.promo{position:relative;width:1080px;height:864px;overflow:hidden;border-top:1px solid var(--edge);border-bottom:1px solid var(--edge)}
.promo iframe{position:absolute;left:-228px;top:0;width:1920px;height:1080px;border:0;transform:scale(.8);transform-origin:0 0}
/* intro / outro */
#intro,#outro{position:absolute;inset:0;visibility:hidden;z-index:30}
.logo{width:300px;height:300px;border-radius:72px;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.1),0 40px 120px -20px color-mix(in srgb,var(--p) 60%,transparent)}
.logo img{width:100%;height:100%;display:block}
.series{font:900 96px/1.2 Cairo,Inter;text-align:center}
.epbig{font:800 46px Cairo,Inter;color:var(--t2)}
.ring{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;border:4px solid var(--p);opacity:0}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:16px;height:104px;padding:0 54px;border-radius:52px;background:var(--p);color:var(--on-p);font:800 46px Cairo,Inter;box-shadow:0 20px 60px -16px color-mix(in srgb,var(--p) 80%,transparent)}
.handle{font:800 56px Inter,Cairo;direction:ltr}
.url{font:700 40px Inter;color:var(--t2);direction:ltr}
.flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--p) 55%,#fff) 0%,transparent 60%);opacity:0;z-index:40;pointer-events:none}
/* cover */
.cover-num{font:900 300px/1 Inter;color:var(--p);direction:ltr;text-shadow:0 0 120px color-mix(in srgb,var(--p) 50%,transparent)}
.cover-title{font:900 128px/1.2 Cairo,Inter;text-align:center;text-wrap:balance}
</style>
</head>
<body>
<div id="stage">
  <div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="grid"></div><div class="vign"></div></div>
  <div id="hdr"><div class="row1"><div class="epchip" id="epchip"></div><div class="datechip" id="datechip"></div></div><div class="segs" id="segs"></div></div>
  <div id="scenes"></div>
  <div id="intro"></div>
  <div id="outro"></div>
  <div class="flash" id="flash"></div>
</div>
<script src="prs.js"></script>
<script src="episodes.js"></script>
<script src="engine.js"></script>
</body>
</html>
