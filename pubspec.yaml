name: gym_tracker
description: "Gym workout tracker: next session, last weight, quick logging"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  connectivity_plus: ^7.3.2
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_screenutil: ^5.9.3
  go_router: ^18.1.2
  intl: ^0.20.3
  meta: ^1.19.0
  liquid_glass_widgets: ^1.16.1
  package_info_plus: ^10.2.2
  posthog_flutter: ^5.58.3
  sentry_flutter: ^10.2.0
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  mobile_scanner: 7.5.0
  flutter_secure_storage: 11.2.0
  app_settings: 9.0.1
  crypto: ^3.0.8
  webview_flutter: 4.14.1
  flutter_cache_manager: ^3.4.8
  http: ^1.6.0
  youtube_player_iframe: ^6.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
  mocktail: ^1.0.5
  sentry_dart_plugin: ^3.4.0
  flutter_native_splash: ^2.4.8
  flutter_flavorizr: ^2.6.0

flutter:
  assets:
    - assets/fonts/Inter/LICENSE.txt
    - assets/fonts/Cairo/LICENSE.txt
    - assets/exercises/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-700.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo/Cairo-400.ttf
          weight: 400
        - asset: assets/fonts/Cairo/Cairo-500.ttf
          weight: 500
        - asset: assets/fonts/Cairo/Cairo-600.ttf
          weight: 600
        - asset: assets/fonts/Cairo/Cairo-700.ttf
          weight: 700
  generate: true
  uses-material-design: true

sentry:
  upload_debug_symbols: true
  upload_sources: true
  # Linking commits needs the Sentry GitHub integration and full history.
  commits: false
  log_level: error
  # Readable issue titles for obfuscated builds: release.yml writes this map
  # with --extra-gen-snapshot-options=--save-obfuscation-map (Sentry docs,
  # "Dart Plugin", read 2026-11-03). Kept out of the symbols artifact: it
  # undoes the obfuscation.
  dart_symbol_map_path: build/app/obfuscation.map.json
