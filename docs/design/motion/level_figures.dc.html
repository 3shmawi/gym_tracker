<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 32px; font-weight: 800">مستواك في عزم</h1>
<p style="margin: 0; font-size: 16px; color: #A9B8AF">بيطلع مع الاستمرارية والتقدّم، ومابينزلش</p>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; flex-grow: 1">
<sc-for list="{{levels}}" as="l" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(90% 70% at 50% 0%, #14532D 0%, rgba(20,83,45,0) 70%), #121915; border: 1px solid #1F2A24; border-radius: 28px; padding: 28px">
<svg width="170" height="198" viewBox="0 0 60 70" role="img" aria-label="{{l.alt}}"><use href="{{l.ref}}"></use></svg>
<span style="font-size: 26px; font-weight: 800">{{l.ar}}</span>
<span style="font-family: Inter, sans-serif; font-size: 15px; font-weight: 700; color: #4ADE80">{{l.en}}</span>
<span style="font-size: 14px; color: #A9B8AF; text-align: center">{{l.rule}}</span>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1130,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      levels: [
        { ref: '#lv1', ar: 'مبتدئ', en: 'Beginner', rule: 'أول 4 أسابيع، أو أقل من 12 تمرين', alt: 'Beginner: a figure lifting a light bar' },
        { ref: '#lv2', ar: 'متوسط', en: 'Intermediate', rule: 'منتظم وأوزانك بتزيد', alt: 'Intermediate: a fitter figure with broader shoulders pressing a heavy bar' },
        { ref: '#lv3', ar: 'محترف', en: 'Pro', rule: 'شهور من الانتظام وأرقام قياسية', alt: 'Pro: a bodybuilder in a double-biceps pose' },
      ],
    };
  }
}
</script>
</body>
</html>
