<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Azm animated splash</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&amp;family=Cairo:wght@800&amp;display=swap">
<style>
body{margin:0}
a{color:#22C55E}a:hover{color:#4ADE80}
.f1load,.f1arms,.f1all,.f2bar,.f2arms,.b3all,.mid,.f3grow,.pumpL,.pumpR,.word{transform-box:fill-box}
/* 1: light lift, then drops the bar so the eye moves on; it comes back at the end as the logo */
.f1load{animation:f1load var(--d) cubic-bezier(.2,.8,.2,1) both}
.f1arms{transform-origin:50% 100%;animation:f1arms var(--d) cubic-bezier(.2,.8,.2,1) both}
.f1all{animation:sideL var(--d) cubic-bezier(.4,0,.2,1) both}
/* 2: heavy lift, slower, a small shake at the top; neighbours step aside */
.f2x{opacity:0;animation:f2appear var(--d) ease both}
.f2bar{animation:f2bar var(--d) both}
.f2arms{transform-origin:50% 100%;animation:f2arms var(--d) both}
.b3all{animation:sideR var(--d) cubic-bezier(.4,0,.2,1) both}
/* 3: flex with a biceps pump */
.f3x{opacity:0;animation:f3appear var(--d) ease both}
.f3grow{transform-origin:50% 100%;animation:f3grow var(--d) cubic-bezier(.2,.9,.3,1.2) both}
.b3fade{animation:b3fade var(--d) ease both}
.b2fade{animation:b2fade var(--d) ease both}
.mid{animation:midL var(--d) cubic-bezier(.4,0,.2,1) both}
.pumpL{transform-origin:95% 60%;animation:pump var(--d) both}
.pumpR{transform-origin:5% 60%;animation:pump var(--d) both}
.word{animation:word var(--d) ease both}

@keyframes f1load{0%{transform:translateY(14px);opacity:1}18%{transform:translateY(0);opacity:1}24%{transform:translateY(10px);opacity:0}90%{transform:translateY(-6px);opacity:0}97%,100%{transform:translateY(0);opacity:1}}
@keyframes f1arms{0%{transform:scaleY(.3);opacity:1}18%{transform:scaleY(1);opacity:1}24%{transform:scaleY(.3);opacity:0}90%{transform:scaleY(.3);opacity:0}97%,100%{transform:scaleY(1);opacity:1}}
@keyframes sideL{0%,26%{transform:translateX(0)}32%,58%{transform:translateX(-4.5px)}62%{transform:translateX(0)}66%,87%{transform:translateX(-2.6px)}93%,100%{transform:translateX(0)}}
@keyframes sideR{0%,26%{transform:translateX(0)}32%,58%{transform:translateX(16px)}64%,100%{transform:translateX(0)}}
@keyframes f2appear{0%,27%{opacity:0}32%,53%{opacity:1}58%,100%{opacity:0}}
@keyframes f2bar{0%,32%{transform:translateY(16px)}48%{transform:translate(0,0)}50%{transform:translate(.8px,0)}52%{transform:translate(-.8px,0)}54%{transform:translate(0,0)}60%,100%{transform:translate(0,14px)}}
@keyframes f2arms{0%,32%{transform:scaleY(.3)}48%,54%{transform:scaleY(1)}60%,100%{transform:scaleY(.3)}}
@keyframes f3appear{0%,64%{opacity:0}69%,87%{opacity:1}92%,100%{opacity:0}}
@keyframes f3grow{0%,64%{transform:scale(.35,.9)}71%,100%{transform:scale(1,1)}}
@keyframes b2fade{0%,27%{opacity:1}32%,53%{opacity:0}58%,100%{opacity:1}}
@keyframes b3fade{0%,64%{opacity:1}69%,87%{opacity:0}92%,100%{opacity:1}}
@keyframes midL{0%,62%{transform:translateX(0)}66%,87%{transform:translateX(-14.1px)}93%,100%{transform:translateX(0)}}
@keyframes pump{0%,71%{transform:scale(1)}75%{transform:scale(1.12)}79%{transform:scale(1.02)}83%{transform:scale(1.1)}87%,100%{transform:scale(1)}}
@keyframes word{0%,90%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){
.anim *,.word{animation:none !important}
.f2x,.f3x{opacity:0 !important}
}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: radial-gradient(120% 60% at 85% 0%, #14532D 0%, rgba(20,83,45,0) 55%), #07120C; color: #F2F7F3; font-family: Inter, Cairo, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; position: relative">
<sc-if value="{{show}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 28px; --d: {{dur}}s">
<svg class="anim" width="270" height="230" viewBox="-4 4 112 85" role="img" aria-label="Azm logo animation: the first figure lifts a light bar, the second a heavier bar, the last bar becomes a bodybuilder flexing, then the logo settles">
<defs>

<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"></stop><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.15"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.55"></stop></linearGradient>
<linearGradient id="greenGlass" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#86EFAC" stop-opacity="0.95"></stop><stop offset="0.55" stop-color="#22C55E" stop-opacity="0.85"></stop><stop offset="1" stop-color="#15803D" stop-opacity="0.9"></stop></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop></linearGradient>

<circle cx="29.5" cy="47.5" r="5" fill="url(#glass)" stroke="url(#edge)" stroke-width="0.8"></circle>

<circle cx="60" cy="33.4" r="4.6" fill="url(#glass)" stroke="url(#edge)" stroke-width="0.8"></circle>
<g class="f2arms"><path d="M54.8 40.6 C53.4 36.6 49 36.4 48.4 38.6 C47 36.6 45.4 34 45.4 31.2 C45.4 29.6 46.2 28.6 47.2 28.2 L47.9 23.4 L51.6 23 C51.4 26 51 28.4 50.6 30.2 C52.6 31.8 53.6 34.4 53.2 37.2 L54.6 44.2 Z" fill="url(#glass)" stroke="url(#edge)" stroke-width="0.8" stroke-linejoin="round"></path><path d="M53.6 39.6 Q51.2 37.8 49.2 39.2 M52.6 36.4 Q52 33.4 50.6 31.8" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="0.7" stroke-linecap="round"></path><path d="M47.2 27 Q48.4 25.6 49.4 24" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="0.6" stroke-linecap="round"></path><circle cx="49.7" cy="22.2" r="2.8" fill="url(#glass)" stroke="url(#edge)" stroke-width="0.6"></circle><path d="M 65.2 40.6 C 66.6 36.6 71 36.4 71.6 38.6 C 73 36.6 74.6 34 74.6 31.2 C 74.6 29.6 73.8 28.6 72.8 28.2 L 72.1 23.4 L 68.4 23 C 68.6 26 69 28.4 69.4 30.2 C 67.4 31.8 66.4 34.4 66.8 37.2 L 65.4 44.2 Z" fill="url(#glass)" stroke="url(#edge)" stroke-width="0.8" stroke-linejoin="round"></path><path d="M 66.4 39.6 Q 68.8 37.8 70.8 39.2 M 67.4 36.4 Q 68 33.4 69.4 31.8" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="0.7" stroke-linecap="round"></path><path d="M 72.8 27 Q 71.6 25.6 70.6 24" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="0.6" stroke-linecap="round"></path><circle cx="70.3" cy="22.2" r="2.8" fill="url(#glass)" stroke="url(#edge)" stroke-width="0.6"></circle></g>
</g>
</g>

<path d="M30 31.8 L30 47 M27 35.6 L33 35.6 M27.3 39.6 L32.7 39.6 M27.6 43.6 L32.4 43.6" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="0.7" stroke-linecap="round"></path>
<circle cx="30" cy="9" r="4.8" fill="url(#glass)" stroke="url(#edge)" stroke-width="0.8"></circle>
<g class="pumpL"><path d="M19.6 18.4 C18 14.4 13.6 14.6 12.8 18.2 C12.9 13.4 11 12.2 10.3 15.8 L10.6 12.2 L5.4 12.6 C4.2 17 3.2 21.5 3.6 24.6 C4 27.6 7.2 28.4 10.5 27.8 C14 27.4 17 27.2 19.4 26.4 Z" fill="url(#glass)" stroke="url(#edge)" stroke-width="0.8" stroke-linejoin="round"></path><path d="M18.6 18.8 Q16.6 15.8 13.6 18 M12.3 17.4 Q12 14.6 10.8 15.6" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="0.7" stroke-linecap="round"></path><path d="M8.2 23 Q6.4 19.4 7.6 14" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="0.6" stroke-linecap="round"></path><circle cx="8" cy="10.4" r="3.9" fill="url(#greenGlass)" stroke="url(#edge)" stroke-width="0.6"></circle></g>

</svg>
<div class="word" style="display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="font-size: 34px; font-weight: 800; letter-spacing: -0.02em">Azm</span>
<span style="font-family: Cairo, sans-serif; font-size: 20px; font-weight: 800; color: #A9B8AF">عزم</span>
</div>
</div>
</sc-if>
<button onClick="{{replay}}" style="position: absolute; bottom: 40px; min-height: 48px; padding: 0 22px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.08); color: #F2F7F3; font: 600 15px Inter, sans-serif; cursor: pointer">Replay animation</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"duration":{"editor":"range","default":2.6,"min":1.2,"max":5,"step":0.1,"unit":"s"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { show: true };
  }
  renderVals() {
    return {
      show: this.state.show,
      dur: this.props.duration ?? 2.6,
      replay: () => {
        this.setState({ show: false });
        setTimeout(() => this.setState({ show: true }), 40);
      },
    };
  }
}
</script>
</body>
</html>
