# Weekly dependency updates. "chore(deps)" commits never trigger a store
# release on their own; the next feat/fix release ships them.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The captain dashboard (dashboard/). Its commits never release the app
  # (scripts/next_version.sh ignores dashboard-only commits).
  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    # Majors that can't be installed yet (checked 2026-11-05):
    # - typescript 7: typescript-eslint 8.72.1 accepts ">=4.8.4 <6.1.0";
    # - @babel/core 8: @preact/preset-vite 2.10.6 accepts "7.x";
    # - @types/node: stays on the Node major Cloudflare builds with
    #   (dashboard/.node-version, 22).
    # Remove an entry when the package that blocks it supports the new major.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: "@babel/core"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ['*']
