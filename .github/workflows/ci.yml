name: CI

on:
  pull_request:
    # ready_for_review: the iOS job below skips drafts, so it starts when
    # the PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:

# Read-only token by default; a job that must write asks for it itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format · analyze · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-flutter
        with:
          packages: 'false'

      # Before pub get, so generated l10n files aren't checked.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Install packages
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      # Includes the UI checks (test/helpers/ui_check.dart): every screen on
      # 4 devices × EN/AR × light/dark × text 1.0/1.3, plus golden screenshots.
      - name: Unit, widget, UI & security tests
        run: flutter test --coverage

      # A changed screen shows up here as master / test / diff images.
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshot-diffs
          path: test/**/failures/
          if-no-files-found: ignore
          retention-days: 14

      - name: Coverage threshold
        env:
          COVERAGE_MIN: ${{ vars.COVERAGE_MIN || '60' }}
        run: ./scripts/coverage_check.sh

  security:
    name: Security scan · secrets · dependencies · database
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Secrets in git history (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git --no-banner --redact -v /repo

      - name: Vulnerable dependencies (OSV-Scanner)
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.7.0 \
            scan source --lockfile=/src/pubspec.lock --lockfile=/src/dashboard/package-lock.json

      # Workflow security: pinned actions, least-privilege tokens, no
      # credentials left on disk, no untrusted text run as shell code.
      # docs/security.md → "CI and secrets".
      - name: Workflow security (zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.31.1 --min-severity low --format github .github/workflows .github/actions

      # The join page's address parsing and platform detection: plain Node, no
      # packages (test/website/join_code.test.js). Hostile addresses must never
      # produce a code.
      - name: Join page logic tests (Node)
        run: node --test test/website/join_code.test.js

      # scripts/next_version.sh: dashboard-only commits never release the app.
      - name: Release version script tests (Node)
        run: node --test test/scripts/next_version.test.mjs

      # Runs once `supabase init` has created supabase/config.toml.
      # RLS tests run when a PR touches supabase/ (or on manual runs).
      - name: Supabase changes?
        id: supabase
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ ! -f supabase/config.toml ]; then
            echo "::notice::No supabase/config.toml — RLS tests skipped (run 'supabase init' once)."
          elif [ -z "$BASE_REF" ] || git diff --name-only "origin/$BASE_REF...HEAD" | grep -q '^supabase/'; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes under supabase/ — RLS tests skipped."
          fi

      - uses: supabase/setup-cli@d239d1052f6f024a8d746d7e5aeddead63b9cb53 # v3.1.0
        if: steps.supabase.outputs.present == 'true'
        with:
          # Pinned: "latest" asks the GitHub API on every run and gets rate-limited.
          version: 2.120.0

      - name: Database security tests (RLS, pgTAP)
        if: steps.supabase.outputs.present == 'true'
        run: |
          supabase db start
          supabase test db

      # Edge Function (Deno) and invite tooling (Python) tests: no database,
      # no secrets. Run when a PR touches them, and on every push to main.
      - name: Backend code changes?
        id: backend
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -z "$BASE_REF" ] || git diff --name-only "origin/$BASE_REF...HEAD" | grep -qE '^(supabase/functions/|scripts/make_invites/)'; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Edge Function or invite tooling changes — their tests are skipped."
          fi

      - name: Edge Function tests (Deno)
        if: steps.backend.outputs.present == 'true'
        run: |
          docker run --rm -v "$PWD/supabase/functions:/app" -w /app \
            denoland/deno:2.9.6 sh -c '
              for d in redeem_invite delete-account; do
                (cd "$d" && deno lint && deno fmt --check && deno test --frozen --no-prompt) || exit 1
              done
              deno lint _shared && deno fmt --check _shared'

      - name: Invite tooling tests (Python, hash-pinned packages)
        if: steps.backend.outputs.present == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/make-invites"
          "$RUNNER_TEMP/make-invites/bin/pip" install --quiet --require-hashes --only-binary=:all: \
            -r scripts/make_invites/requirements.txt
          "$RUNNER_TEMP/make-invites/bin/python" -m unittest discover -s scripts/make_invites

  # The captain web dashboard (dashboard/, docs/features/dashboard.md):
  # typecheck, lint, unit tests, build with the security-header check, and
  # Playwright end-to-end tests against a mocked Supabase (no network, no
  # secrets: the two VITE_ values below are placeholders, not a project).
  # Runs in Playwright's own image (Node + browsers), pinned by digest.
  dashboard:
    name: Dashboard · typecheck · lint · test · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    defaults:
      run:
        working-directory: dashboard
    env:
      VITE_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_key
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node version (needs 22.12 or newer)
        run: node -e 'const [a,b]=process.versions.node.split(".").map(Number); if (a<22||(a===22&&b<12)) { console.error("Node "+process.versions.node+" is too old"); process.exit(1) } console.log("Node "+process.versions.node)'

      - name: Install packages (lockfile only)
        run: npm ci --no-audit --no-fund

      - name: Known vulnerabilities (npm audit)
        run: npm audit --audit-level=low

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Built files keep the CSP rules
        run: node scripts/check_dist.mjs

      - name: End-to-end tests (Playwright, mocked Supabase)
        run: npm run e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-playwright-report
          path: |
            dashboard/playwright-report/
            dashboard/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Whether the PR touches anything the app is built from. The iOS
  # integration job is the slow one (macOS runner, Xcode build), so a PR that
  # only changes docs, scripts or other workflows skips it. A skipped job
  # counts as passed for required checks. Drafts skip it too: mark the PR
  # "Ready for review" to run it.
  changes:
    name: What changed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE_REF...HEAD" \
            | grep -qE '^(lib/|ios/|integration_test/|assets/|env/|l10n\.yaml$|pubspec\.(yaml|lock)$|\.fvmrc$|\.github/workflows/ci\.yml$|\.github/actions/)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "No app changes: the iOS integration tests are skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Every integration test, on an iPhone simulator with full Liquid Glass
  # (Metal), like a real phone. Same runner as the demo videos.
  integration-ios:
    name: Integration tests (iOS simulator)
    needs: changes
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft == false
      && needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-flutter
        id: flutter

      # The Xcode build is most of this job's time: keep the Swift packages
      # and Flutter's iOS build between runs (actions/cache saves only after
      # a green run). Not DerivedData: it is several GB, so saving and
      # restoring it costs about what it saves. Keyed on everything that
      # changes these; a partial match still makes the build incremental.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/SourcePackages
            build/ios
          key: ios-build-${{ runner.os }}-${{ steps.flutter.outputs.version }}-${{ hashFiles('pubspec.lock', 'ios/**/Package.resolved', 'ios/Podfile.lock', 'ios/**/project.pbxproj') }}
          restore-keys: |
            ios-build-${{ runner.os }}-${{ steps.flutter.outputs.version }}-

      - name: Run integration tests
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r \
            '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone [0-9]+( Pro)?$"))] | last | .udid')
          if [ -z "$udid" ] || [ "$udid" = null ]; then echo "::error::No iPhone simulator on this runner."; exit 1; fi
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b > /dev/null
          set -o pipefail
          flutter test integration_test -d "$udid" --flavor staging --dart-define-from-file=env/example.json 2>&1 | tee integration.log

      # The failing lines as annotations on the run, so you don't have to
      # dig through the whole log.
      - name: Why the integration tests failed
        if: failure()
        run: |
          [ -f integration.log ] || exit 0
          grep -n -E 'EXCEPTION CAUGHT|Expected:|Actual:|Which:|Test failed|\[E\]|Error:|was thrown|Timed out|not found|_test\.dart:[0-9]+' integration.log \
            | head -n 100 > failures.txt || true
          split -b 3500 -d failures.txt part_ 2>/dev/null || true
          n=0; for part in part_*; do [ -f "$part" ] || continue; n=$((n+1)); [ "$n" -gt 8 ] && break
            echo "::error title=integration failures ($n)::$(sed 's/%/%25/g' "$part" | awk '{printf "%s%%0A", $0}')"
          done
          echo "::error title=integration log (end)::$(grep -v -E 'Kotlin|KGP|plugin|^\s*$' integration.log | tail -n 40 | tail -c 3500 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"

  # Android: the app must build. Flows are tested on the iOS simulator
  # above: the CI Android emulator (software rendering) went offline at the
  # end of every app run, losing the results, in every setup tried.
  android-build:
    name: Android build (debug APK)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-flutter
        with:
          java: 'true'
          gradle-cache: 'true'
          packages: 'false'

      - name: Build
        run: |
          flutter pub get
          flutter gen-l10n
          flutter build apk --debug --flavor staging --dart-define-from-file=env/example.json
